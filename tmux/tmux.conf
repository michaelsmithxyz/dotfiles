unbind C-b
set -g prefix C-Space

set-option -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256:RGB"

set -g status-interval 5
set -g status-left ""
set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] %I:%M %p '
set -g status-right-length 100

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set -g history-limit 20000

set -g detach-on-destroy off

bind-key S run-shell '
  path="$(tmux display -p -F "#{pane_current_path}")"
  name="$(tmux display -p -F "#{b:pane_current_path}")"
  src_win="$(tmux display -p "#{window_id}")"

  # Create the destination session if needed (with a temporary window)
  tmux new-session -ds "$name" -c "$path" -n __tmp__ 2>/dev/null || true

  # Ensure new windows in that session default to the cwd
  tmux set-option -t "$name" default-path "$path" 2>/dev/null || true

  # Move the current window into the destination session (closes it in the source)
  tmux move-window -s "$src_win" -t "$name:"

  # If we created a temporary first window, remove it
  tmux kill-window -t "$name:__tmp__" 2>/dev/null || true

  # Jump to the moved window in the new session
  tmux switch-client -t "$name"
'

# Session picker popup with fzf
bind-key Tab run-shell "\
  tmux list-sessions -f '##{?session_attached,0,1}' -F '##{session_name}' |\
  fzf --tmux center,80%,50% --reverse --header 'Switch Session (C-x: kill)' \
          --preview 'tmux capture-pane -pet {}' \
          --preview-window 'right,border-left' \
          --ansi \
          --bind 'ctrl-x:execute-silent(tmux kill-session -t {})+reload(tmux list-sessions -f \"##{?session_attached,0,1}\" -F \"##{session_name}\")' |\
  xargs -r tmux switch-client -t
"

setw -g mouse on

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-key F

set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text ' #{pane_current_command} #{b:pane_current_path}'
set -g @catppuccin_window_current_text ' #{pane_current_command} #{b:pane_current_path}'

run '~/.config/tmux/plugins/tpm/tpm'
