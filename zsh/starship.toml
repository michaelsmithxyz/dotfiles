format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$python\
$aws\
$line_break\
$jobs\
$character"""

[hostname]
ssh_only = true

[username]
show_always = false

[jobs]
number_threshold = 1

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'
